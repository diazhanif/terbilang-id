[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terbilang-id"
version = "0.1.0"
description = "Library dan CLI untuk mengubah bilangan menjadi kata Bahasa Indonesia"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "terbilang-id contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
terbilang-id = "terbilang_id.core:main"

[tool.setuptools.packages.find]
where = ["src"]
